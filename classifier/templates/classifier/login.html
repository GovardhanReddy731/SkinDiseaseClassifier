<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Login / Signup - SkinCare AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap" rel="stylesheet" />

    <style>
        body {
            background: #fff8f0;
            font-family: 'Quicksand', sans-serif;
        }
        .auth-container {
            max-width: 450px;
            margin: 6rem auto;
            padding: 2rem;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #ff5e78;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .btn-custom {
            background-color: #ff6b81;
            color: white;
            font-weight: 600;
            width: 100%;
        }
        .btn-custom:hover {
            background-color: #e4556f;
        }
        .form-control:focus {
            border-color: #ff6b81;
            box-shadow: 0 0 5px rgba(255, 107, 129, 0.5);
        }
        .nav-tabs .nav-link.active {
            color: #ff6b81;
            border-bottom: 2px solid #ff6b81;
        }
        .text-center a {
            color: #ff6b81;
            text-decoration: none;
        }
        .text-center a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup" type="button" role="tab">Signup</button>
        </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
        <!-- Login Tab -->
        <div class="tab-pane fade show active" id="login" role="tabpanel">
            <h2>Login</h2>
            {% if form.errors %}
                <div class="alert alert-danger">Invalid username or password.</div>
            {% endif %}
            <form method="post" action="{% url 'login' %}" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" required maxlength="150" class="form-control" id="id_username" value="{{ form.username.value|default:'' }}">
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" required class="form-control" id="id_password" />
                </div>
                <button type="submit" class="btn btn-custom">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'password_reset' %}">Forgot password?</a>
            </div>
        </div>

        <!-- Signup Tab -->
        <div class="tab-pane fade" id="signup" role="tabpanel">
            <h2>Signup</h2>
            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_new_username" class="form-label">Username</label>
                    <input type="text" name="username" required class="form-control" id="id_new_username" />
                </div>
                <div class="mb-3">
                    <label for="id_email" class="form-label">Email</label>
                    <input type="email" name="email" required class="form-control" id="id_email" />
                </div>
                <div class="mb-3">
                    <label for="id_new_password" class="form-label">Password</label>
                    <input type="password" name="password1" required class="form-control" id="id_new_password" />
                </div>
                <div class="mb-3">
                    <label for="id_confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" name="password2" required class="form-control" id="id_confirm_password" />
                </div>
                <button type="submit" class="btn btn-custom">Signup</button>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
